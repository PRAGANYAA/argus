<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Hexagon background -->
  <polygon 
    points="100,8 185,52 185,148 100,192 15,148 15,52" 
    fill="#1E3B2F" 
    rx="10"
  />
  <!-- Rounded hexagon using path for smoother edges -->
  <path 
    d="M100,12 L182,56 L182,144 L100,188 L18,144 L18,56 Z" 
    fill="#1E3B2F"
  />

  <!-- Scales of Justice icon in cream/beige -->
  <!-- Center vertical beam (staff) -->
  <rect x="97" y="68" width="6" height="68" fill="#C9B99A" rx="2"/>
  
  <!-- Horizontal top bar -->
  <rect x="62" y="72" width="76" height="6" fill="#C9B99A" rx="3"/>

  <!-- Left pan string left -->
  <line x1="72" y1="78" x2="60" y2="106" stroke="#C9B99A" stroke-width="3" stroke-linecap="round"/>
  <!-- Left pan string right -->
  <line x1="82" y1="78" x2="94" y2="106" stroke="#C9B99A" stroke-width="3" stroke-linecap="round"/>

  <!-- Right pan string left -->
  <line x1="118" y1="78" x2="106" y2="106" stroke="#C9B99A" stroke-width="3" stroke-linecap="round"/>
  <!-- Right pan string right -->
  <line x1="128" y1="78" x2="140" y2="106" stroke="#C9B99A" stroke-width="3" stroke-linecap="round"/>

  <!-- Left pan (bowl arc) -->
  <path d="M58,106 Q77,122 96,106" stroke="#C9B99A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Right pan (bowl arc) -->
  <path d="M104,106 Q123,122 142,106" stroke="#C9B99A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Base of staff (wider foot) -->
  <rect x="86" y="132" width="28" height="5" fill="#C9B99A" rx="2.5"/>
</svg>